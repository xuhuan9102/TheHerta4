[Constants]
global $glowfx_h = 0
global $glowfx_s = 0
global $glowfx_v = 0
global $glowfx_brightness = 1
global $glowfx_interpolate = 0
global $efmiglowfx_count = 0
global $efmiglowfx_instances = 0
global $efmiglowfx_start = 0
global $efmiglowfx_base = 0
global $efmiglowfx_first_instance = 0

[ResourceGlowFXMap]
[ResourceEFMIGlowFXSavedT64]

; Forward skinned-character VS layout, shared with EFMITTL's lit pass.
[ShaderRegexEFMIGlowFXLitVS]
shader_model = vs_5_0
filter_index = 73414

[ShaderRegexEFMIGlowFXLitVS.Pattern]
^vs_5_0\n(?:dcl_globalFlags[^\n]*\n)?(?:dcl_constantbuffer[^\n]*\n)+dcl_resource_structured t\d+, \d+\n(?:dcl_(?:resource|sampler)[^\n]*\n)*(?:dcl_input v\d+\.[xyzw]+\n)+dcl_input_sgv v\d+\.x, instance_id\ndcl_output_siv o0\.xyzw, position\ndcl_output o1\.xy\ndcl_output o2\.xyz\ndcl_output o3\.xyz\ndcl_output o4\.xyzw\ndcl_output o5\.xyz\ndcl_output o6\.xyz\ndcl_output o7\.xyz\n(?:dcl_output o8\.xyz\ndcl_output o9\.x\n|dcl_output o8\.xyzw\ndcl_output o9\.xyz\ndcl_output o10\.x\n)

[CommandListEFMIGlowFXRun]
if __GLOW_PASS__ && $efmiglowfx_count > 0 && $efmiglowfx_instances > 0 && $glowfx_brightness > 0 && @ResourceGlowFXMap
    local $saved_x224 = x224
    local $saved_y224 = y224
    local $saved_z224 = z224
    local $saved_w224 = w224
    ResourceEFMIGlowFXSavedT64 = ref ps-t64
    ps-t64 = ref ResourceGlowFXMap
    x224 = ($glowfx_h / 360.0) * $glowfx_interpolate
    y224 = ($glowfx_s / 100.0) * $glowfx_interpolate
    z224 = ($glowfx_v / 100.0) * $glowfx_interpolate
    w224 = $glowfx_brightness
    run = CustomShaderEFMIGlowFX
    ps-t64 = ref ResourceEFMIGlowFXSavedT64
    ResourceEFMIGlowFXSavedT64 = null
    x224 = $saved_x224
    y224 = $saved_y224
    z224 = $saved_z224
    w224 = $saved_w224
endif
ResourceGlowFXMap = null
$glowfx_h = 0
$glowfx_s = 0
$glowfx_v = 0
$glowfx_brightness = 1
$glowfx_interpolate = 0

[CustomShaderEFMIGlowFX]
ps = res/efmi_glow_fx_ps.hlsl
depth_enable = true
depth_write_mask = zero
depth_func = equal
depth_stencil_state_merge = true
stencil_write_mask = 0
blend[0] = add one one
mask[0] = 7
mask[1] = 0
mask[2] = 0
mask[3] = 0
mask[4] = 0
mask[5] = 0
mask[6] = 0
mask[7] = 0
drawindexedinstanced = $efmiglowfx_count, $efmiglowfx_instances, $efmiglowfx_start, $efmiglowfx_base, $efmiglowfx_first_instance
