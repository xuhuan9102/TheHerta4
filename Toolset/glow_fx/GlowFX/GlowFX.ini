[Constants]
global $glowfx_h = 0.0
global $glowfx_s = 0.0
global $glowfx_v = 0.0
global $glowfx_brightness = 1.0
global $glowfx_interpolate = 0.0
global $glowfx_emission_only = 0
global $glowfx_drawcount = 0
global $glowfx_drawstart = 0
global $glowfx_drawbase = 0

global $geoGlowReady = 0
global $geoGlowWidth = 0
global $geoGlowHeight = 0
global $geoGlowLayerAlpha = 0

[Present]
pre run = CommandListGeoGlowResetFrame

[ResourceGlowFXMap]

[CommandListGlowFXRun]
if $glowfx_drawcount > 0 && $glowfx_brightness > 0 && o3 !== null && o4 === null && $\SlotFix\is_color_shader && !$\SlotFix\is_outline_shader
    local $saved_x224 = x224
    local $saved_y224 = y224
    local $saved_z224 = z224
    local $saved_w224 = w224
    ps-t64 = ref ResourceGlowFXMap
    x224 = ($glowfx_h / 360.0) * $glowfx_interpolate
    y224 = ($glowfx_s / 100.0) * $glowfx_interpolate
    z224 = ($glowfx_v / 100.0) * $glowfx_interpolate
    w224 = $glowfx_brightness * (1 - 2 * $glowfx_emission_only)
    run = CommandListGeoGlowStamp
    ps-t64 = null
    x224 = $saved_x224
    y224 = $saved_y224
    z224 = $saved_z224
    w224 = $saved_w224
endif
ResourceGlowFXMap = null
$glowfx_h = 0
$glowfx_s = 0
$glowfx_v = 0
$glowfx_brightness = 1.0
$glowfx_interpolate = 0
$glowfx_emission_only = 0
$glowfx_drawcount = 0
$glowfx_drawstart = 0
$glowfx_drawbase = 0

[ResourceGeoGlowMaskCoverage]
format = R32G32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowMask]
format = R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowVisibleCoverage]
format = R32G32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowVisible]
format = R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowStampDepth]

[ResourceGeoGlowWorldDepth]

[ResourceGeoGlowPrefilterBack]
format = R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowPrefilterCoverage]
format = R32G32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowPrefilter]
format = R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowBlurBack]
format = R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowBlurCoverage]
format = R32G32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowBlur]
format = R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

[ResourceGeoGlowTarget]

[ResourceGeoGlowScene]
bind_flags = shader_resource

[ResourceGeoGlowO0]
[ResourceGeoGlowO1]
[ResourceGeoGlowO2]
[ResourceGeoGlowO3]
[ResourceGeoGlowOD]

[CommandListGeoGlowSaveOutputs]
ResourceGeoGlowO0 = ref o0
ResourceGeoGlowO1 = ref o1
ResourceGeoGlowO2 = ref o2
ResourceGeoGlowO3 = ref o3
ResourceGeoGlowOD = ref od

[CommandListGeoGlowRestoreOutputs]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceGeoGlowO0
o1 = ref ResourceGeoGlowO1
o2 = ref ResourceGeoGlowO2
o3 = ref ResourceGeoGlowO3
od = ref ResourceGeoGlowOD
ResourceGeoGlowO0 = null
ResourceGeoGlowO1 = null
ResourceGeoGlowO2 = null
ResourceGeoGlowO3 = null
ResourceGeoGlowOD = null

[CommandListGeoGlowStamp]
if rt_width != $geoGlowWidth || rt_height != $geoGlowHeight
    $geoGlowWidth = rt_width
    $geoGlowHeight = rt_height
    ResourceGeoGlowMask = null
    ResourceGeoGlowMaskCoverage = null
    ResourceGeoGlowStampDepth = null
    ResourceGeoGlowVisible = null
    ResourceGeoGlowVisibleCoverage = null
    ResourceGeoGlowPrefilter = null
    ResourceGeoGlowPrefilterCoverage = null
    ResourceGeoGlowPrefilterBack = null
    ResourceGeoGlowBlur = null
    ResourceGeoGlowBlurCoverage = null
    ResourceGeoGlowBlurBack = null
    $geoGlowReady = 0
endif
if !@ResourceGeoGlowMask
    ResourceGeoGlowMask = copy_desc o0
    ResourceGeoGlowMaskCoverage = copy_desc o0
    ResourceGeoGlowVisible = copy_desc o0
    ResourceGeoGlowVisibleCoverage = copy_desc o0
    ResourceGeoGlowPrefilter = copy_desc o0
    ResourceGeoGlowPrefilterCoverage = copy_desc o0
    ResourceGeoGlowPrefilterBack = copy_desc o0
    ResourceGeoGlowBlur = copy_desc o0
    ResourceGeoGlowBlurCoverage = copy_desc o0
    ResourceGeoGlowBlurBack = copy_desc o0
endif
if !@ResourceGeoGlowStampDepth && @od
    ResourceGeoGlowStampDepth = copy_desc od unless_null
endif
if @ResourceGeoGlowMask && @ResourceGeoGlowMaskCoverage && @ResourceGeoGlowVisible && @ResourceGeoGlowVisibleCoverage && @ResourceGeoGlowPrefilter && @ResourceGeoGlowPrefilterCoverage && @ResourceGeoGlowPrefilterBack && @ResourceGeoGlowBlur && @ResourceGeoGlowBlurCoverage && @ResourceGeoGlowBlurBack && @ResourceGeoGlowStampDepth && @od
    if !$geoGlowReady
        clear = ResourceGeoGlowMask
        clear = ResourceGeoGlowMaskCoverage
        clear = ResourceGeoGlowStampDepth 0.0
        $geoGlowReady = 1
    endif
    run = CommandListGeoGlowSaveOutputs
    ResourceGeoGlowWorldDepth = ref od
    run = CustomShaderGeoGlowMask
    run = CommandListGeoGlowRestoreOutputs
endif

[CustomShaderGeoGlowMask]
ps = res/glow_fx_ps.hlsl
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = disable
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceGeoGlowMask
o1 = ResourceGeoGlowMaskCoverage
od = ref ResourceGeoGlowStampDepth
ps-t67 = ref ResourceGeoGlowWorldDepth
drawindexed = $glowfx_drawcount, $glowfx_drawstart, $glowfx_drawbase
ps-t67 = null

[ShaderOverrideGeoGlowWorldHDR]
hash = 5b043c5784c3b4ed
allow_duplicate_hash = true
run = CommandListGeoGlowWorldHDR

[ShaderOverrideGeoGlowAgentSceneHDR]
hash = 6443f79de027d780
allow_duplicate_hash = true
run = CommandListGeoGlowAgentSceneHDR

[CommandListGeoGlowAgentSceneHDR]
$geoGlowLayerAlpha = 1
run = CommandListGeoGlowWorldHDR
$geoGlowLayerAlpha = 0

[CommandListGeoGlowWorldHDR]
if $geoGlowReady && INDEX_COUNT == 6 && @ps-t0
    if ps-t0->Width == $geoGlowWidth && ps-t0->Height == $geoGlowHeight
        ResourceGeoGlowTarget = ref ps-t0
        ps-t0 = null
        run = CommandListGeoGlowCompose
        ps-t0 = ref ResourceGeoGlowTarget
        ResourceGeoGlowTarget = null
    endif
endif

[ShaderOverrideGeoGlowTAA]
hash = 7eabecd5696f8d79
allow_duplicate_hash = true
run = CommandListGeoGlowTAA

[CommandListGeoGlowTAA]
; Feed the halo into the current-frame HDR input, before temporal resolve.
if $geoGlowReady && VERTEX_COUNT == 3 && @ps-t2 && @ps-t3 && @o1
    if ps-t2->Width == $geoGlowWidth && ps-t2->Height == $geoGlowHeight
        ResourceGeoGlowTarget = ref ps-t2
        ps-t2 = null
        run = CommandListGeoGlowCompose
        ps-t2 = ref ResourceGeoGlowTarget
        ResourceGeoGlowTarget = null
    endif
endif

[CommandListGeoGlowCompose]
ResourceGeoGlowScene = copy ResourceGeoGlowTarget
if @ResourceGeoGlowTarget && @ResourceGeoGlowScene
    run = CommandListGeoGlowSaveOutputs
    clear = ResourceGeoGlowVisible
    clear = ResourceGeoGlowVisibleCoverage
    run = CustomShaderGeoGlowVisibility
    local $saved_halo_x224 = x224
    local $saved_halo_y224 = y224
    local $saved_glow_prefilter_z224 = z224
    local $saved_glow_layer_w224 = w224
    x224 = __GLOW_RADIUS__
    y224 = __GLOW_NORMALIZATION__
    w224 = $geoGlowLayerAlpha
    if x224 > 0
        z224 = 0
        run = CustomShaderGeoGlowPrefilterH
        run = CustomShaderGeoGlowHorizontal
        z224 = 1
        run = CustomShaderGeoGlowPrefilterV
    endif
    run = CustomShaderGeoGlowComposite
    x224 = $saved_halo_x224
    y224 = $saved_halo_y224
    z224 = $saved_glow_prefilter_z224
    w224 = $saved_glow_layer_w224
    run = CommandListGeoGlowRestoreOutputs
    run = CommandListGeoGlowResetFrame
endif

[CommandListGeoGlowResetFrame]
$geoGlowReady = 0
ResourceGeoGlowWorldDepth = null

[CustomShaderGeoGlowVisibility]
vs = res/geom_glow_vs.hlsl
ps = res/geom_glow_visibility_ps.hlsl
hs = null
ds = null
gs = null
topology = triangle_list
cull = none
depth_enable = true
depth_write_mask = zero
depth_func = greater_equal
stencil_enable = false
blend = disable
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceGeoGlowVisible
o1 = ResourceGeoGlowVisibleCoverage
od = ref ResourceGeoGlowWorldDepth
ps-t64 = ResourceGeoGlowMask
ps-t69 = ResourceGeoGlowMaskCoverage
draw = 3, 0
ps-t69 = null
ps-t64 = null

[CustomShaderGeoGlowHorizontal]
vs = res/geom_glow_vs.hlsl
ps = res/geom_glow_horizontal_ps.hlsl
hs = null
ds = null
gs = null
topology = triangle_list
cull = none
depth_enable = false
blend = disable
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceGeoGlowBlur
o1 = ResourceGeoGlowBlurBack
o2 = ResourceGeoGlowBlurCoverage
ps-t64 = ResourceGeoGlowPrefilter
ps-t65 = ResourceGeoGlowPrefilterBack
ps-t69 = ResourceGeoGlowPrefilterCoverage
draw = 3, 0
ps-t69 = null
ps-t64 = null
ps-t65 = null

[CustomShaderGeoGlowComposite]
vs = res/geom_glow_vs.hlsl
ps = res/geom_glow_composite_ps.hlsl
hs = null
ds = null
gs = null
topology = triangle_list
cull = none
depth_enable = false
blend = disable
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache ResourceGeoGlowTarget
ps-t64 = ResourceGeoGlowVisible
ps-t65 = ResourceGeoGlowPrefilter
ps-t68 = ResourceGeoGlowPrefilterBack
ps-t66 = ResourceGeoGlowScene
ps-t67 = ref ResourceGeoGlowWorldDepth
ps-t69 = ResourceGeoGlowPrefilterCoverage
ps-t70 = ResourceGeoGlowVisibleCoverage
draw = 3, 0
ps-t69 = null
ps-t70 = null
ps-t67 = null
ps-t64 = null
ps-t65 = null
ps-t68 = null
ps-t66 = null

[CustomShaderGeoGlowPrefilterH]
vs = res/geom_glow_vs.hlsl
ps = res/geom_glow_prefilter_ps.hlsl
hs = null
ds = null
gs = null
topology = triangle_list
cull = none
depth_enable = false
blend = disable
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceGeoGlowPrefilter
o1 = ResourceGeoGlowPrefilterBack
o2 = ResourceGeoGlowPrefilterCoverage
ps-t64 = ResourceGeoGlowVisible
ps-t69 = ResourceGeoGlowVisibleCoverage
draw = 3, 0
ps-t69 = null
ps-t64 = null

[CustomShaderGeoGlowPrefilterV]
vs = res/geom_glow_vs.hlsl
ps = res/geom_glow_prefilter_ps.hlsl
hs = null
ds = null
gs = null
topology = triangle_list
cull = none
depth_enable = false
blend = disable
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceGeoGlowPrefilter
o1 = ResourceGeoGlowPrefilterBack
o2 = ResourceGeoGlowPrefilterCoverage
ps-t64 = ResourceGeoGlowBlur
ps-t65 = ResourceGeoGlowBlurBack
ps-t69 = ResourceGeoGlowBlurCoverage
draw = 3, 0
ps-t69 = null
ps-t64 = null
ps-t65 = null
