namespace = GlowFX

[Constants]
global $H = 0.0
global $S = 0.0
global $V = 0.0
global $brightness = 1.0
global $interpolate = 0.0
global $DrawCount = 0
global $DrawStart = 0
global $DrawBase = 0

[ResourceGlowMap]

[CommandListRun]
if $DrawCount > 0
    ps-t64 = ref ResourceGlowMap
    x224 = ($H / 360.0) * $interpolate
    y224 = ($S / 100.0) * $interpolate
    z224 = ($V / 100.0) * $interpolate
    w224 = $brightness
    run = CustomShaderGlowFX
endif

ps-t64 = null
x224 = 0
y224 = 0
z224 = 0
w224 = 0
ResourceGlowMap = null
$H = 0
$S = 0
$V = 0
$brightness = 1.0
$interpolate = 0
$DrawCount = 0
$DrawStart = 0
$DrawBase = 0

[CustomShaderGlowFX]
ps = ../res/glow_fx_ps.hlsl
blend = ADD ONE ONE
alpha = ADD ZERO ONE
blend[1] = ADD ONE ONE
alpha[1] = ADD ZERO ONE
blend[2] = ADD ONE ONE
alpha[2] = ADD ZERO ONE
blend[3] = ADD ONE ONE
alpha[3] = ADD ZERO ONE
depth_enable = true
depth_write_mask = zero
depth_func = equal
drawindexed = $DrawCount, $DrawStart, $DrawBase
clear = ps-t64
