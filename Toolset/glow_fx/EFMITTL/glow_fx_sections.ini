[ResourceGlowFXMap]
[ResourceGlowFXSavedT64]

[CommandListCaptureGlowFX]
local $saved_x224 = x224
local $saved_y224 = y224
local $saved_z224 = z224
local $saved_w224 = w224
local $saved_x181 = x181
local $saved_y181 = y181
ResourceGlowFXSavedT64 = ref ps-t64
ps-t64 = ref ResourceGlowFXMap
x224 = $glowfx_hue
y224 = $glowfx_saturation
z224 = $glowfx_value
w224 = $glowfx_brightness
x181 = $glowfx_capture_group
y181 = 0
if $glowfx_only
    w224 = -$glowfx_brightness
    run = CustomShaderGlowFXOnlyBack
    run = CustomShaderGlowFXOnlyFront
else
    run = CustomShaderAddGlowFXBack
    run = CustomShaderAddGlowFXFront
endif
y181 = 1
if ResourceGlowFXBack !== null
    run = CustomShaderGlowFXEmitterBack
endif
if ResourceGlowFXFront !== null
    run = CustomShaderGlowFXEmitterFront
endif
ps-t64 = ref ResourceGlowFXSavedT64
ResourceGlowFXSavedT64 = null
x224 = $saved_x224
y224 = $saved_y224
z224 = $saved_z224
w224 = $saved_w224
x181 = $saved_x181
y181 = $saved_y181

[CommandListGlowFXFrontTargets]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFrontColor
oD = ref ResourceFrontDepth
drawindexed = $count, $first, 0

[CommandListGlowFXBackTargets]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceBackColor
oD = ref ResourceBackDepth
drawindexed = $count, $first, 0

[CustomShaderAddGlowFXFront]
ps = shaders\glow_fx_capture.hlsl
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
blend = ADD ONE ONE
alpha = ADD ZERO ONE
mask[0] = 7
run = CommandListGlowFXFrontTargets

[CustomShaderAddGlowFXBack]
ps = shaders\glow_fx_capture.hlsl
cull = front
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
blend = ADD ONE ONE
alpha = ADD ZERO ONE
mask[0] = 7
run = CommandListGlowFXBackTargets

[CustomShaderGlowFXOnlyFront]
ps = shaders\glow_fx_capture.hlsl
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = disable
mask[0] = 15
run = CommandListGlowFXFrontTargets

[CustomShaderGlowFXOnlyBack]
ps = shaders\glow_fx_capture.hlsl
cull = front
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = disable
mask[0] = 15
run = CommandListGlowFXBackTargets
