; Glow FX capture extension with EFMITTL halo resolve.
[ResourceGlowFXFront]
[ResourceGlowFXBack]
[ResourceGlowFXSavedT65]

[ResourceGlowFXSeedNear]
format = R32G32B32A32_FLOAT
width_multiply = 0.5
height_multiply = 0.5
[ResourceGlowFXSeedFar]
format = R32G32B32A32_FLOAT
width_multiply = 0.5
height_multiply = 0.5
[ResourceGlowFXBlurNear]
format = R32G32B32A32_FLOAT
width_multiply = 0.5
height_multiply = 0.5
[ResourceGlowFXBlurFar]
format = R32G32B32A32_FLOAT
width_multiply = 0.5
height_multiply = 0.5

[CommandListApplyGlowFXHalo]
if ResourceSceneDepth !== null && $width >= 2 && $height >= 2
    if ResourceGlowFXSeedNear === null
        ResourceGlowFXSeedNear = copy_desc ResourceSceneColor
        ResourceGlowFXSeedFar = copy_desc ResourceSceneColor
        ResourceGlowFXBlurNear = copy_desc ResourceSceneColor
        ResourceGlowFXBlurFar = copy_desc ResourceSceneColor
    endif
    if ResourceGlowFXSeedNear !== null && ResourceGlowFXSeedFar !== null && ResourceGlowFXBlurNear !== null && ResourceGlowFXBlurFar !== null
        local $saved_x181 = x181
        local $saved_y181 = y181
        local $saved_z181 = z181
        local $saved_w181 = w181
        ResourceGlowFXSavedT64 = ref ps-t64
        ResourceGlowFXSavedT65 = ref ps-t65
        run = CommandListGlowFXComposeGroups
        ps-t64 = ref ResourceGlowFXSavedT64
        ps-t65 = ref ResourceGlowFXSavedT65
        ResourceGlowFXSavedT64 = null
        ResourceGlowFXSavedT65 = null
        x181 = $saved_x181
        y181 = $saved_y181
        z181 = $saved_z181
        w181 = $saved_w181
    endif
endif

[CommandListGlowFXComposeGroup]
run = CustomShaderGlowFXHaloSeed
w181 = 0
run = CustomShaderGlowFXHaloHorizontal
w181 = 1
run = CustomShaderGlowFXHaloVertical

[CustomShaderGlowFXHaloSeed]
vs = shaders\composite.hlsl
hs = null
ds = null
gs = null
ps = shaders\glow_fx_halo_seed.hlsl
blend = disable
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache ResourceGlowFXSeedNear
o1 = ref ResourceGlowFXSeedFar
run = CommandListGlowFXBindEmitters
run = CommandListGlowFXBindDepthLayers
draw = 3, 0
run = CommandListGlowFXUnbindDepthLayers
run = CommandListGlowFXRestoreEmitters

[CustomShaderGlowFXHaloHorizontal]
vs = shaders\composite.hlsl
hs = null
ds = null
gs = null
ps = shaders\glow_fx_halo_blur.hlsl
blend = disable
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache ResourceGlowFXBlurNear
o1 = ref ResourceGlowFXBlurFar
ps-t64 = ref ResourceGlowFXSeedNear
ps-t65 = ref ResourceGlowFXSeedFar
draw = 3, 0
ps-t64 = null
ps-t65 = null

[CustomShaderGlowFXHaloVertical]
vs = shaders\composite.hlsl
hs = null
ds = null
gs = null
ps = shaders\glow_fx_halo_blur.hlsl
blend = ADD ONE ONE
alpha = ADD ZERO ONE
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache ResourceSceneColor
ps-t64 = ref ResourceGlowFXBlurNear
ps-t65 = ref ResourceGlowFXBlurFar
run = CommandListGlowFXBindDepthLayers
draw = 3, 0
run = CommandListGlowFXUnbindDepthLayers
ps-t64 = null
ps-t65 = null
