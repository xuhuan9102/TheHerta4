namespace = TTL

[Constants]
global $glowfx_hue = 0
global $glowfx_saturation = 0
global $glowfx_value = 0
global $glowfx_brightness = 0

[ResourceGlowFXMap]
[ResourceGlowFXSavedT64]

[CommandListCaptureGlowFX]
local $saved_x224 = x224
local $saved_y224 = y224
local $saved_z224 = z224
local $saved_w224 = w224
ResourceGlowFXSavedT64 = ref ps-t64
ps-t64 = ref ResourceGlowFXMap
x224 = $glowfx_hue
y224 = $glowfx_saturation
z224 = $glowfx_value
w224 = $glowfx_brightness
if $layer_back_render
    run = CustomShaderCaptureGlowFXBack
endif
run = CustomShaderCaptureGlowFXFront
x224 = $saved_x224
y224 = $saved_y224
z224 = $saved_z224
w224 = $saved_w224
ps-t64 = ref ResourceGlowFXSavedT64
ResourceGlowFXSavedT64 = null

[CustomShaderCaptureGlowFXFront]
ps = Shaders\CaptureGlowFX.hlsl
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
blend = ADD ONE ONE
alpha = ADD ZERO ONE
run = BuiltInCommandListUnbindAllRenderTargets
if $layer_color_target == 1
    o0 = ref ResourceFrontColor1
else
    o0 = ref ResourceFrontColor
endif
oD = ref ResourceFrontDepth
run = CommandListDrawIndexedAutoOrArgs

[CustomShaderCaptureGlowFXBack]
ps = Shaders\CaptureGlowFX.hlsl
cull = back
front = Clockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
blend = ADD ONE ONE
alpha = ADD ZERO ONE
run = BuiltInCommandListUnbindAllRenderTargets
if $layer_color_target == 1
    o0 = ref ResourceBackColor1
else
    o0 = ref ResourceBackColor
endif
oD = ref ResourceBackDepth
run = CommandListDrawIndexedAutoOrArgs
