; Force field master switch and gain, read by ForceField.hlsl (:63 x, :123 y, :52 w).
; Written here - the first thing inside the gate on any frame this mod computes at all -
; instead of inside CommandListDrawWorld's if block, because every other switch in
; that block has a safe fallback when it is left at 0 (x44 radius, x46 speed,
; x47 gravity: see ParticleConfig.hlsl:26 / FluidSolver.hlsl:37,146) while
; IniParams[41].x is the one switch that fails closed: a 0 there is silence.
; 41/45/48/58/59 are this mod's own lanes next to the 29-40 block (42/43 carry the
; per-emitter gates read by Slots.hlsl:56 - they are NOT free).
; w41 is the per-field switch family flag. The exporter rewrites this line to a
; literal 0/1 on every export (1 only when some field is switched off), so 58/59
; can never be read on a stale value left behind by another mod -- IniParams has
; no namespace, which is why the 0 has to be written too, not just skipped.
; 硬门控：角色不在场时连 IniParams 抄写和 CS dispatch 都不做。上面那些 ref 保存与
; 下面恢复只是槽位记账、不 dispatch，保留对称。
if $costume_mods
    x41 = $force_enabled
    y41 = $force_scale
    w41 = 0
    run = CommandListBuildCamera
    run = CommandListDrawWorld
endif
    ; nhd-pick: 深度快照挪到角色 draw 完成之后（tonemap 段），
    ; 原位置在 DrawWorld 开头，那时角色还没写进深度 ⇒ 身体穿过。
    ResourceCollisionDepth = copy ResourceDepth
