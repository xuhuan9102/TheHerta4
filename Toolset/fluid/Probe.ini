namespace = LiquidGravityProbe
[Constants]
global $emitting = 0
global $toggle_pulse_request = 0
global $drain_elapsed = 0
global $seen = 0
global $initialized = 0
global $drawn = 0
global $depth_test = 1
global $strength_level = 3
global $slot_count = 8
global $auto_pulse = 0
global $liquid_tint_r = 1.0000
global $liquid_tint_g = 1.0000
global $liquid_tint_b = 1.0000
global $liquid_absorb_mm = 15
global $liquid_wet_darken = 0.85
global $liquid_puddle_reflect = 0.15
global $liquid_stream_reflect = 1.6
global $liquid_scatter = 0.35
global $liquid_refraction = 0.02
global $trickle9 = 0
global $trickle_evt = -100
global $trickle_age = 100
[KeyTrickle9]
key = no_alt no_ctrl no_shift VK_NUMPAD9
run = CommandListTrickle9
[CommandListTrickle9]
$trickle_evt = time
if $trickle9
    $trickle9 = 0
else
    $trickle9 = 1
endif

[KeyAutoPulse]
key = no_alt no_ctrl no_shift VK_NUMPAD4
type = cycle
$auto_pulse = 0,1

; The camera of camera/Camera.hlsl, built every frame.
[ResourceCamera]
type = RWStructuredBuffer
stride = 16
array = 24
[ResourceCameraSource]
[ResourceDepth]
[ResourceSceneColor]
[ResourceFluidLighting]
; The composite's environment light: upper, then broad (fluid/FluidAmbient.hlsl).
[ResourceFluidAmbient]
type = RWStructuredBuffer
stride = 16
array = 2
[CustomShaderFluidAmbient]
cs = fluid/FluidAmbient.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t100 = ref ResourceFluidLighting
cs-u0 = ResourceFluidAmbient
dispatch = 1,1,1
cs-u0 = null
cs-t100 = null
[CommandListDrawWorld]
if $seen && !$drawn && $costume_mods
    x241 = $surface_mode
; Particle radius in metres; 0 keeps the compiled default.
x44 = $fluid_particle_radius
; Launch speed in m/s; 0 falls back to whatever the strength level implies.
x46 = $fluid_launch_speed
x47 = $fluid_gravity_scale
; nhd-pick: sentinel — 1 only when this exporter wrote x47. FluidSolver.hlsl:37
; uses it to tell "panel says 0 (no gravity)" from "an old mod never wrote 47.x",
; which both read as 0 in IniParams. Written here, in the same per-frame gate as
; x47 itself: the CS passes that read it run later in this very command list, and
; when the gate is shut no compute runs at all, so a stale value can never be read.
z47 = 1
y47 = $fluid_viscosity
    ; Per-emitter on/off gates, read by slotEmitOn in Slots.hlsl.
    ; Slots 0-3 in 42.x/.y/.z/.w and slots 4-7 in 43.x/.y/.z/.w; every gate is 1
    ; unless the mod binds a key for that emitter, so unbound mods are unchanged.
    x42 = $fluid_emit_0
    y42 = $fluid_emit_1
    z42 = $fluid_emit_2
    w42 = $fluid_emit_3
    x43 = $fluid_emit_4
    y43 = $fluid_emit_5
    z43 = $fluid_emit_6
    w43 = $fluid_emit_7
    if !$initialized
        clear = ResourceSlotState
        clear = ResourceFluidA
        clear = ResourceFluidB
        clear = ResourceFluidState
        clear = ResourceFluidSheetFrame
        clear = ResourceFocusMomentum
        clear = ResourceJetGuide
        clear = ResourcePulseState
        clear = ResourceAdhesionFrames
        clear = ResourceSplashA
        clear = ResourceSplashB
        clear = ResourceCollisionEvents
        clear = ResourceCollisionCounter
        clear = ResourceSplashFreeCounter
        clear = ResourcePuddleTransferCounter
        clear = ResourceFluidAmbient
        $initialized = 1
    endif
    ; Snapshot the completed live main-view depth at injection time.
    ; A compute-pass SRV may be an earlier surface or a stencil-plane view.
    run = CommandListFluidFrame
    ; Composite pending TTL layers before taking the fluid's refraction background.
    Resource\TTL\FluidOrderTarget = ref ResourceSceneColor
    run = CommandList\TTL\ApplyBeforeFluid
    ResourceFluidLighting = copy ResourceSceneColor
    w253 = $fluid_dt
    run = CustomShaderFluidAmbient
    ; Use the same snapshot for collision and occlusion. Normalized UV lookup
    ; also supports final color targets whose size differs from native depth.
    y237 = $depth_test
    ; Look settings for the composite; FluidComposite.hlsl reads this layout.
    x251 = $liquid_tint_r
    y251 = $liquid_tint_g
    z251 = $liquid_tint_b
    w251 = $liquid_absorb_mm / 1000
    x252 = $liquid_wet_darken
    y252 = $liquid_puddle_reflect
    z252 = $liquid_stream_reflect
    w252 = $liquid_scatter
    x253 = $liquid_refraction
    ; Screen-space fluid: particle depth and thickness, two smoothing rounds
    ; ping-ponging A -> B -> A, then one composite over the scene color.
    ResourceFluidDepthA = copy_desc ResourceSceneColor
    ResourceFluidDepthB = copy_desc ResourceSceneColor
    ResourceFluidThicknessA = copy_desc ResourceSceneColor
    ResourceFluidThicknessB = copy_desc ResourceSceneColor
    ResourceFluidColor = copy_desc ResourceSceneColor
    ResourceFluidAbsorptionDepth = copy_desc ResourceSceneColor
    clear = ResourceFluidDepthA 1e30
    clear = ResourceFluidThicknessA 0
    clear = ResourceFluidColor 0
    clear = ResourceFluidAbsorptionDepth 0
    run = CustomShaderFluidSurface
    run = CustomShaderFluidSmoothH
    run = CustomShaderFluidSmoothV
    run = CustomShaderFluidSmoothH
    run = CustomShaderFluidSmoothV
    run = CommandList\LiquidGravityProbe\Composite\FluidComposite
    $drawn = 1
endif
if !$seen
    $initialized = 0
endif
[Present]
; Map transitions/loading frames must not retain old map buffers.
if !$seen
    $initialized = 0
    ResourceCameraSource = null
    ResourceDepth = null
    
endif
; Key sections only change the request. Lifecycle commands run here, never in Key.
; 角色门控就是总开关：这一帧角色被画到就喷，没被画就整套停（不 spawn、
; 不解算、不合成）。边沿在这里换，Pulse.hlsl 拿 $toggle_pulse_request 的
; 增量开一次起始脉冲。
if $costume_mods
    if !$emitting
        $emitting = 1
        $toggle_pulse_request = $toggle_pulse_request + 1
    endif
else
    $emitting = 0
endif
if $emitting || $trickle9
    $drain_elapsed = 0
endif
; 门关后的残留：① 合成整块在门内，门关就不跑，旧 RT 不会被采样；② 这里的
; $initialized = 0 让下次进门时走 [CommandListDrawWorld] 的 clear（16 个流体 RT 全清），
; 旧粒子/水洼/附着不会复活。
if !$costume_mods
    $initialized = 0
endif
post run = CommandListEndFrame
post $seen = 0
post $drawn = 0
[CommandListEndFrame]
$main_width = $view_width
$view_width = 0
clear = ResourceSurfaceCandidates
clear = ResourceSurfaceStats


[Constants]
global $surface_mode = 1
global $capture = 0
global $draw_camera = 0
global $root_low = -1.3
global $root_high = 1.2

[ResourceSurfaceStats]
type = RWStructuredBuffer
stride = 16
array = 9
[ResourceSurfaceInstance]
[ResourceSurfaceProfiles]
type = RWStructuredBuffer
stride = 16
array = 20480
[ResourceSurfaceModelOffsets]
type = RWStructuredBuffer
stride = 16
array = 4096

; Characters the capture hooks reported this frame: a count row, then
; CANDIDATE_ROWS rows for each of CANDIDATE_CAPACITY (ParticleConfig.hlsl).
[ResourceSurfaceCandidates]
type = RWStructuredBuffer
stride = 16
array = 145
; SLOT_ROWS rows for each of SLOT_COUNT character slots (Slots.hlsl).
[ResourceSlotState]
type = RWStructuredBuffer
stride = 16
array = 128
[ResourceDrawCamera]
type = RWStructuredBuffer
stride = 16
array = 24
[ResourceDrawCameraSource]
[ResourceTrianglePositions]
type = Texture2D
format = R32G32B32A32_FLOAT
width = 3
height = 1
array = 1
mips = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
[CommandListMarkPresent]
$present = 1
; The capture runs inside the game's own draw, and the shaders it dispatches
; leave their slots changed. A renderer that caches its bindings, such as
; Unreal's, would not bind them again and later passes would read ours.
[CommandListCaptureSurface]
ResourceCaptureSavedCsCB1 = ref cs-cb1
ResourceCaptureSavedCsCB13 = ref cs-cb13
ResourceCaptureSavedCsT0 = ref cs-t0
ResourceCaptureSavedCsT1 = ref cs-t1
ResourceCaptureSavedCsT2 = ref cs-t2
ResourceCaptureSavedCsT113 = ref cs-t113
ResourceCaptureSavedCsU0 = ref cs-u0
ResourceCaptureSavedCsU1 = ref cs-u1
ResourceCaptureSavedGsT113 = ref gs-t113
run = CommandListCaptureSurfaceBody
cs-cb1 = ref ResourceCaptureSavedCsCB1
cs-cb13 = ref ResourceCaptureSavedCsCB13
cs-t0 = ref ResourceCaptureSavedCsT0
cs-t1 = ref ResourceCaptureSavedCsT1
cs-t2 = ref ResourceCaptureSavedCsT2
cs-t113 = ref ResourceCaptureSavedCsT113
cs-u0 = ref ResourceCaptureSavedCsU0
cs-u1 = ref ResourceCaptureSavedCsU1
gs-t113 = ref ResourceCaptureSavedGsT113
ResourceCaptureSavedCsCB1 = null
ResourceCaptureSavedCsCB13 = null
ResourceCaptureSavedCsT0 = null
ResourceCaptureSavedCsT1 = null
ResourceCaptureSavedCsT2 = null
ResourceCaptureSavedCsT113 = null
ResourceCaptureSavedCsU0 = null
ResourceCaptureSavedCsU1 = null
ResourceCaptureSavedGsT113 = null
[ResourceCaptureSavedCsCB1]
[ResourceCaptureSavedCsCB13]
[ResourceCaptureSavedCsT0]
[ResourceCaptureSavedCsT1]
[ResourceCaptureSavedCsT2]
[ResourceCaptureSavedCsT113]
[ResourceCaptureSavedCsU0]
[ResourceCaptureSavedCsU1]
[ResourceCaptureSavedGsT113]
[CommandListCaptureSurfaceBody]
run = CommandList\LiquidGravityProbe\JSONProfiles\Initialize
if $surface_mode && $costume_mods
    $capture = 0
    $draw_camera = 0
    ; Characters draw the main view's G-buffer with the object constants at cb1,
    ; whose row 3 is the world root of the part drawn, and the camera in the
    ; shader's own globals at cb0. A planar reflection draws them again into
    ; narrower targets and shadows into none, which are skipped. The object
    ; constants grow with what a field lights them with, and
    ; surface/ResolveSurface.hlsl rejects a row 3 that is no root.
    if o3 !== null && o0->Width == $main_width
        ResourceDrawCameraSource = copy vs-cb0
        $draw_camera = 1
        ResourceSurfaceInstance = copy vs-cb1
        w242 = 3
        $capture = 1
    endif
    if $capture && $draw_camera
        if $draw_camera == 2
            ResourceDrawCameraSource = copy ResourceCameraSource
        endif
        run = CommandListBuildDrawCamera
        x242 = $root_low
        y242 = $root_high
        if vs == 612001
            run = CustomShaderCaptureTrianglePosition1
        elif vs == 612002
            run = CustomShaderCaptureTrianglePosition2
        elif vs == 612003
            run = CustomShaderCaptureTrianglePosition3
        elif vs == 612004
            run = CustomShaderCaptureTrianglePosition4
        elif vs == 612005
            run = CustomShaderCaptureTrianglePosition5
        elif vs == 612006
            run = CustomShaderCaptureTrianglePosition6
        elif vs == 612007
            run = CustomShaderCaptureTrianglePosition7
        elif vs == 612008
            run = CustomShaderCaptureTrianglePosition8
        elif vs == 612009
            run = CustomShaderCaptureTrianglePosition9
        elif vs == 612010
            run = CustomShaderCaptureTrianglePosition10
        elif vs == 612011
            run = CustomShaderCaptureTrianglePosition11
        elif vs == 612012
            run = CustomShaderCaptureTrianglePosition12
        else
            run = CustomShaderCaptureTriangle
        endif
        run = CustomShaderResolveSurface
    endif
endif
; Vertex shaders may write SV_Position after their other outputs, at a
; register that differs between them, as Unreal's and some of Unity's do. A
; geometry shader whose input holds only SV_Position reads register 0, so
; each filter_index 6120KK below names register K and selects
; surface/CaptureTriangle_PositionK.hlsl, which declares the registers before
; it. Shaders matching none write it to register 0.
[ShaderRegexLiquidPositionAt1]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612001
[ShaderRegexLiquidPositionAt1.Pattern]
dcl_output_siv\h+o1\.xyzw,\h+position
[ShaderRegexLiquidPositionAt2]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612002
[ShaderRegexLiquidPositionAt2.Pattern]
dcl_output_siv\h+o2\.xyzw,\h+position
[ShaderRegexLiquidPositionAt3]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612003
[ShaderRegexLiquidPositionAt3.Pattern]
dcl_output_siv\h+o3\.xyzw,\h+position
[ShaderRegexLiquidPositionAt4]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612004
[ShaderRegexLiquidPositionAt4.Pattern]
dcl_output_siv\h+o4\.xyzw,\h+position
[ShaderRegexLiquidPositionAt5]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612005
[ShaderRegexLiquidPositionAt5.Pattern]
dcl_output_siv\h+o5\.xyzw,\h+position
[ShaderRegexLiquidPositionAt6]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612006
[ShaderRegexLiquidPositionAt6.Pattern]
dcl_output_siv\h+o6\.xyzw,\h+position
[ShaderRegexLiquidPositionAt7]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612007
[ShaderRegexLiquidPositionAt7.Pattern]
dcl_output_siv\h+o7\.xyzw,\h+position
[ShaderRegexLiquidPositionAt8]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612008
[ShaderRegexLiquidPositionAt8.Pattern]
dcl_output_siv\h+o8\.xyzw,\h+position
[ShaderRegexLiquidPositionAt9]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612009
[ShaderRegexLiquidPositionAt9.Pattern]
dcl_output_siv\h+o9\.xyzw,\h+position
[ShaderRegexLiquidPositionAt10]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612010
[ShaderRegexLiquidPositionAt10.Pattern]
dcl_output_siv\h+o10\.xyzw,\h+position
[ShaderRegexLiquidPositionAt11]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612011
[ShaderRegexLiquidPositionAt11.Pattern]
dcl_output_siv\h+o11\.xyzw,\h+position
[ShaderRegexLiquidPositionAt12]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 612012
[ShaderRegexLiquidPositionAt12.Pattern]
dcl_output_siv\h+o12\.xyzw,\h+position
