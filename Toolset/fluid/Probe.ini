[Constants]
global $fluid_last_time = 0
global $fluid_dt = 0.0166667
; Emitter force fields (ForceField.hlsl). The exporter sets these when any
; emitter carries a field; both zero keeps the solver's cost at one read.
global $force_enabled = 0
global $force_scale = 1
global $fluid_particle_radius = 0.0028
global $fluid_gravity_scale = 1.0
global $fluid_viscosity = 0
global $fluid_launch_speed = 0.514
; Per-emitter emission gates (Slots.hlsl slotEmitOn). All 1 by default; the
; exporter adds one [KeyFluidEmitN] section per emitter that has a hotkey.
global $fluid_emit_0 = 1
global $fluid_emit_1 = 1
global $fluid_emit_2 = 1
global $fluid_emit_3 = 0
global $fluid_emit_4 = 0
global $fluid_emit_5 = 0
global $fluid_emit_6 = 0
global $fluid_emit_7 = 0
[ResourceFluidA]
