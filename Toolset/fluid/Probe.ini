stride = 64
array = 8192
[ResourceFocusMomentum]
type = RWStructuredBuffer
stride = 16
array = 8192
[ResourceFluidSheetFrame]
type = RWStructuredBuffer
stride = 16
array = 8192
; Four rows per slot (FluidSolver.hlsl PHASE_STATE).
[ResourceFluidState]
type = RWStructuredBuffer
stride = 16
array = 32
; Three float4 rows per field, FORCE_FIELDS_PER_SLOT per slot (ForceField.hlsl):
; SLOT_COUNT * 4 * 3 = 96. Each row is (offset.xyz, type) / (axis.xyz, radius) /
; (strength, falloff exponent, 0, enabled). The exporter writes `data` when an
; emitter carries a field; without one the buffer stays zero and x41 keeps the
; pass from touching it at all.
[ResourceFluidForceField]
type = Buffer
format = R32G32B32A32_FLOAT
array = 96
[CommandListFluidFrame]
$fluid_dt = time - $fluid_last_time
$fluid_last_time = time
if $fluid_dt <= 0 || $fluid_dt > 0.1
