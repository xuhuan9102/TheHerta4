namespace = TTL
; Fluid integration for TTLib 2.3: consume the pending layers on the fluid's
; HDR scene target, before its lighting/refraction snapshot and composite.
; The regular consumers then see no pending layers and cannot cover the fluid.
;
; Public input: Resource\TTL\FluidOrderTarget = ref <fluid scene color>
; Public call:  run = CommandList\TTL\ApplyBeforeFluid

[CommandListApplyBeforeFluid]
if $enabled && ($has_pending_layer || $has_pending_layer_obj) && @ResourceFluidOrderTarget
    run = CustomShaderFluidOrder
endif
ResourceFluidOrderTarget = null

; CustomShader preserves native outputs, UAVs, viewport and render states.
; Texture bindings need their own save/restore.
[CustomShaderFluidOrder]
ResourceFluidOrderT20 = ref ps-t20
ResourceFluidOrderT21 = ref ps-t21
ResourceFluidOrderT22 = ref ps-t22
ResourceFluidOrderT23 = ref ps-t23
ResourceFluidOrderT26 = ref ps-t26
ResourceFluidOrderT29 = ref ps-t29
ResourceFluidOrderFlip = ref ResourceWorldRTFlip

; The HDR scene and TTL captures use camera UVs. The native late transfer's
; flip applies only to that later target; a null t29 samples zero here.
ResourceWorldRTFlip = null
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFluidOrderTarget
run = CommandListApplyLateWorldComposite
ResourceWorldRTFlip = ref ResourceFluidOrderFlip

ps-t20 = ref ResourceFluidOrderT20
ps-t21 = ref ResourceFluidOrderT21
ps-t22 = ref ResourceFluidOrderT22
ps-t23 = ref ResourceFluidOrderT23
ps-t26 = ref ResourceFluidOrderT26
ps-t29 = ref ResourceFluidOrderT29

; Do not retain native targets across a window resize or map transition.
ResourceFluidOrderT20 = null
ResourceFluidOrderT21 = null
ResourceFluidOrderT22 = null
ResourceFluidOrderT23 = null
ResourceFluidOrderT26 = null
ResourceFluidOrderT29 = null
ResourceFluidOrderFlip = null

[ResourceFluidOrderTarget]
[ResourceFluidOrderT20]
[ResourceFluidOrderT21]
[ResourceFluidOrderT22]
[ResourceFluidOrderT23]
[ResourceFluidOrderT26]
[ResourceFluidOrderT29]
[ResourceFluidOrderFlip]
