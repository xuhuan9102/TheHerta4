namespace = TTL

[Constants]
global $_1 = 0
global $_2 = 0
global $_3 = 0
global $alpha = 1
global $V = 1
global $mask_channel = 3
global $mask_invert = 1
global $pending = 0
global $world_composite = 0
global $lighting_available = 0
global $lighting_seen = 0
global $lighting_depth_slot = 2
global $lighting_defer_composite = 0
global $capture_width = 0
global $capture_height = 0
global persist $anti_fade = 1
post x121 = $anti_fade

[KeyAPMITTLAntiFade]
key = ctrl no_alt no_shift F7
type = cycle
$anti_fade = 0, 1

[Present]
post $pending = 0
post $world_composite = 0
post ResourceSceneColor = null
post ResourceSceneDepth = null
post $lighting_available = $lighting_seen
post $lighting_seen = 0
post x121 = $anti_fade

[ResourceTransparencyTex]
[ResourceLayerColor]
bind_flags = render_target shader_resource
[ResourceLayerAlbedo]
bind_flags = render_target shader_resource
[ResourceLayerNormal]
bind_flags = render_target shader_resource
[ResourceLayerMaterial]
bind_flags = render_target shader_resource
[ResourceLayerMotion]
bind_flags = render_target
[ResourceLayerDepth]
bind_flags = depth_stencil shader_resource
[ResourceLayerDepthSample]
bind_flags = shader_resource
format = R32_FLOAT_X8X24_TYPELESS
[ResourceLayerMask]
bind_flags = render_target shader_resource
format = R16G16B16A16_FLOAT
[ResourceSceneColor]
[ResourceSceneDepth]

[ResourceSavedColor]
[ResourceSavedAlbedo]
[ResourceSavedNormal]
[ResourceSavedMaterial]
[ResourceSavedMotion]
[ResourceSavedDepth]
[ResourceSavedT2]
[ResourceSavedT3]
[ResourceSavedT4]
[ResourceSavedT5]
[ResourceSavedT69]
[ResourceSavedT70]
[ResourceSavedT71]
[ResourceSavedT72]

; This auxiliary shader writes only o0 while the five material targets are still bound.
[ShaderOverrideAPMITTLAuxiliary]
hash = 9887d1a165def2c5
allow_duplicate_hash = true
filter_index = 86720.2

; The lighting shader determines where APMI binds the depth and material inputs.

[ShaderOverrideAPMITTLLighting]
hash = 1ee8887b70b8d33d
allow_duplicate_hash = true
post $lighting_depth_slot = 2
post $lighting_defer_composite = 0
post run = CommandListResolve

[ShaderOverrideAPMITTLWorldLighting]
hash = de32e6ad97a50d48
allow_duplicate_hash = true
post $lighting_depth_slot = 2
post $lighting_defer_composite = 1
post run = CommandListResolve

[ShaderOverrideAPMITTLWorldClusteredLighting]
hash = 2dba0c7ba7c47f81
allow_duplicate_hash = true
post $lighting_depth_slot = 9
post $lighting_defer_composite = 1
post run = CommandListResolve

; Blend after the world background and forward passes have assembled the HDR scene.
[ShaderOverrideAPMITTLWorldComposite]
hash = bd470af0c9bdf384
allow_duplicate_hash = true
post run = CommandListCompositeWorld

[CommandListDraw]
; Material variants share the same five G-buffer targets across camera angles.
if $lighting_available && ps != 86720.2 && @o0 && @o1 && @o2 && @o3 && @o4 && !@o5 && @oD
    if !$pending
        run = CommandListPrepareLayer
    endif
    if $pending && @o0 === @ResourceSceneColor
        run = CommandListCapture
    else
        drawindexed = $_1, $_2, $_3
    endif
elif ps != 86720.2 || (!$pending && !$world_composite)
    drawindexed = $_1, $_2, $_3
endif
ResourceTransparencyTex = null
$_1 = 0
$_2 = 0
$_3 = 0
$alpha = 1
$V = 1
$mask_channel = 3
$mask_invert = 1

[CommandListPrepareLayer]
if !@ResourceLayerColor || $capture_width != rt_width || $capture_height != rt_height
    $capture_width = rt_width
    $capture_height = rt_height
    ResourceLayerColor = copy_desc o0
    ResourceLayerAlbedo = copy_desc o1
    ResourceLayerNormal = copy_desc o2
    ResourceLayerMaterial = copy_desc o3
    ResourceLayerMotion = copy_desc o4
    ResourceLayerMask = copy_desc o0
    ResourceLayerDepth = copy_desc oD
endif
if @ResourceLayerColor && @ResourceLayerAlbedo && @ResourceLayerNormal && @ResourceLayerMaterial && @ResourceLayerMotion && @ResourceLayerMask && @ResourceLayerDepth
    ResourceSceneColor = ref o0
    clear = ResourceLayerColor
    clear = ResourceLayerAlbedo
    clear = ResourceLayerNormal
    clear = ResourceLayerMaterial
    clear = ResourceLayerMotion
    clear = ResourceLayerMask
    clear = ResourceLayerDepth depth stencil 0 0
    $pending = 1
endif

[CommandListCapture]
ResourceSavedColor = ref o0
ResourceSavedAlbedo = ref o1
ResourceSavedNormal = ref o2
ResourceSavedMaterial = ref o3
ResourceSavedMotion = ref o4
ResourceSavedDepth = ref oD
o0 = ref ResourceLayerColor
o1 = ref ResourceLayerAlbedo
o2 = ref ResourceLayerNormal
o3 = ref ResourceLayerMaterial
o4 = ref ResourceLayerMotion
oD = ref ResourceLayerDepth
drawindexed = $_1, $_2, $_3
o1 = null
o2 = null
o3 = null
o4 = null
o0 = ref ResourceLayerMask
ResourceSavedT69 = ref ps-t69
ps-t69 = ref ResourceTransparencyTex
x69 = $alpha
y69 = $mask_channel
z69 = $mask_invert
w69 = $V
run = CustomShaderCaptureMask
ps-t69 = ref ResourceSavedT69
ResourceSavedT69 = null
x69 = 0
y69 = 0
z69 = 0
w69 = 0
o0 = ref ResourceSavedColor
o1 = ref ResourceSavedAlbedo
o2 = ref ResourceSavedNormal
o3 = ref ResourceSavedMaterial
o4 = ref ResourceSavedMotion
oD = ref ResourceSavedDepth
ResourceSavedColor = null
ResourceSavedAlbedo = null
ResourceSavedNormal = null
ResourceSavedMaterial = null
ResourceSavedMotion = null
ResourceSavedDepth = null

[CustomShaderCaptureMask]
ps = APMI_TTLMask.hlsl
blend = disable
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
drawindexed = $_1, $_2, $_3

[CommandListResolve]
if index_count == 3 && @o0 && @ps-t[$lighting_depth_slot] && @ps-t[$lighting_depth_slot + 1] && @ps-t[$lighting_depth_slot + 2] && @ps-t[$lighting_depth_slot + 3]
    $lighting_seen = 1
    if $pending && @o0 === @ResourceSceneColor
        run = CommandListReplayLighting
        ResourceSceneDepth = ref ps-t[$lighting_depth_slot]
        if $lighting_defer_composite
            $world_composite = 1
        else
            run = CommandListComposite
            ResourceSceneDepth = null
        endif
        $pending = 0
        ResourceSceneColor = null
    endif
endif

[CommandListCompositeWorld]
if $world_composite && index_count == 6 && @o0 && @ResourceSceneDepth && rt_width == $capture_width && rt_height == $capture_height
    run = CommandListComposite
    $world_composite = 0
    ResourceSceneDepth = null
endif

[CommandListReplayLighting]
ResourceLayerDepthSample = copy ResourceLayerDepth
ResourceSavedColor = ref o0
ResourceSavedDepth = ref oD
ResourceSavedT2 = ref ps-t[$lighting_depth_slot]
ResourceSavedT3 = ref ps-t[$lighting_depth_slot + 1]
ResourceSavedT4 = ref ps-t[$lighting_depth_slot + 2]
ResourceSavedT5 = ref ps-t[$lighting_depth_slot + 3]
oD = null
o0 = ref ResourceLayerColor
ps-t[$lighting_depth_slot] = ref ResourceLayerDepthSample
ps-t[$lighting_depth_slot + 1] = ref ResourceLayerAlbedo
ps-t[$lighting_depth_slot + 2] = ref ResourceLayerNormal
ps-t[$lighting_depth_slot + 3] = ref ResourceLayerMaterial
run = CustomShaderReplayLighting
o0 = ref ResourceSavedColor
oD = ref ResourceSavedDepth
ps-t[$lighting_depth_slot] = ref ResourceSavedT2
ps-t[$lighting_depth_slot + 1] = ref ResourceSavedT3
ps-t[$lighting_depth_slot + 2] = ref ResourceSavedT4
ps-t[$lighting_depth_slot + 3] = ref ResourceSavedT5
ResourceSavedColor = null
ResourceSavedDepth = null
ResourceSavedT2 = null
ResourceSavedT3 = null
ResourceSavedT4 = null
ResourceSavedT5 = null

[CustomShaderReplayLighting]
depth_enable = false
stencil_enable = false
draw = from_caller

[CommandListComposite]
ResourceSavedDepth = ref oD
ResourceSavedT69 = ref ps-t69
ResourceSavedT70 = ref ps-t70
ResourceSavedT71 = ref ps-t71
ResourceSavedT72 = ref ps-t72
oD = null
ps-t69 = ref ResourceLayerColor
ps-t70 = ref ResourceLayerMask
ps-t71 = ref ResourceLayerDepthSample
ps-t72 = ref ResourceSceneDepth
run = CustomShaderComposite
ps-t69 = ref ResourceSavedT69
ps-t70 = ref ResourceSavedT70
ps-t71 = ref ResourceSavedT71
ps-t72 = ref ResourceSavedT72
oD = ref ResourceSavedDepth
ResourceSavedDepth = null
ResourceSavedT69 = null
ResourceSavedT70 = null
ResourceSavedT71 = null
ResourceSavedT72 = null

[CustomShaderComposite]
vs = APMI_TTLComposite.hlsl
ps = APMI_TTLComposite.hlsl
blend = ADD SRC_ALPHA INV_SRC_ALPHA
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
draw = 3, 0

; Camera fade in character G-buffer passes. Keep the other material discards.
[ShaderRegexAPMITTLCameraFadeWeight]
shader_model = ps_4_0 ps_5_0
temps = ttlCameraFade
pre x121 = $anti_fade

[ShaderRegexAPMITTLCameraFadeWeight.Pattern]
(?<dither>^dp2\h+r0\.x,\h+v0\.xyxx,\h+l\(0\.067(?:11056\d*|111),\h+0\.005(?:8371499\d*|837),\h+0(?:\.0+)?,\h+0(?:\.0+)?\)(?<eol>\r?\n)
frc\h+r0\.x,\h+r0\.x\k<eol>
mul\h+r0\.x,\h+r0\.x,\h+l\(52\.98291\d*\)\k<eol>
frc\h+r0\.x,\h+r0\.x\k<eol>
add\h+r0\.x,\h+-r0\.x,\h+(?<fade>cb3\[(?:32|34)\]\.y|cb4\[34\]\.y|cb[23]\[73\]\.z)\k<eol>
lt\h+r0\.x,\h+r0\.x,\h+l\(0(?:\.0+)?\)\k<eol>)
(?<discard>discard_nz\h+r0\.x\k<eol>)
(?<body>(?s:.*?))
(?<weight_op>^add\h+(?<weight>r\d+\.[xyzw]),\h+\k<fade>,\h+l\(-0\.800000\d*\)\k<eol>)
(?=mul_sat\h+\k<weight>,\h+\k<weight>,\h+l\(5(?:\.0+(?:48)?)?\)\k<eol>)

[ShaderRegexAPMITTLCameraFadeWeight.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120

[ShaderRegexAPMITTLCameraFadeWeight.Pattern.Replace]
${dither}ld_indexable(texture1d)(float,float,float,float) ${ttlCameraFade}.x, l(121, 0), t120.x${eol}
movc r0.x, ${ttlCameraFade}.x, l(0), r0.x${eol}
${discard}${body}${weight_op}movc ${weight}, ${ttlCameraFade}.x, l(0.200000), ${weight}${eol}

[ShaderRegexAPMITTLCameraFadeDiscard]
shader_model = ps_4_0
temps = ttlCameraFade
pre x121 = $anti_fade

[ShaderRegexAPMITTLCameraFadeDiscard.Pattern]
(?<dither>^dp2\h+r0\.x,\h+v0\.xyxx,\h+l\(0\.067(?:11056\d*|111),\h+0\.005(?:8371499\d*|837),\h+0(?:\.0+)?,\h+0(?:\.0+)?\)(?<eol>\r?\n)
frc\h+r0\.x,\h+r0\.x\k<eol>
mul\h+r0\.x,\h+r0\.x,\h+l\(52\.98291\d*\)\k<eol>
frc\h+r0\.x,\h+r0\.x\k<eol>
add\h+r0\.x,\h+-r0\.x,\h+
(?=(?:cb[12]\[4\]\.x|cb2\[32\]\.y|cb2\[(?:17|73)\]\.z|cb3\[34\]\.y)\k<eol>)
(?<fadeBuffer>cb[123]\[\d+\])\.(?<fadeLane>[xyz])\k<eol>
lt\h+r0\.x,\h+r0\.x,\h+l\(0(?:\.0+)?\)\k<eol>)
(?<discard>discard_nz\h+r0\.x\k<eol>)
(?![\s\S]*\k<fadeBuffer>\.[xyzw]{0,3}\k<fadeLane>)

[ShaderRegexAPMITTLCameraFadeDiscard.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120

[ShaderRegexAPMITTLCameraFadeDiscard.Pattern.Replace]
${dither}ld_indexable(texture1d)(float,float,float,float) ${ttlCameraFade}.x, l(121, 0), t120.x${eol}
movc r0.x, ${ttlCameraFade}.x, l(0), r0.x${eol}
${discard}

