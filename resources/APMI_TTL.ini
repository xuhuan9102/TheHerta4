dp2\h+r0\.x,\h+v0\.xyxx,\h+l\(0\.067(?:11056\d*|111),\h+0\.005(?:8371499\d*|837),\h+0(?:\.0+)?,\h+0(?:\.0+)?\)(?<eol>\r?\n)
