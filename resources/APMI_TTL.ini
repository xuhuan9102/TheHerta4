(?=mul_sat\h+\k<weight>,\h+\k<weight>,\h+l\(5(?:\.0+(?:48)?)?\)\k<eol>)

[ShaderRegexAPMITTLFaceFadeWeight.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120

[ShaderRegexAPMITTLFaceFadeWeight.Pattern.Replace]
${dither}ld_indexable(texture1d)(float,float,float,float) ${ttlFaceFade}.x, l(121, 0), t120.y${eol}
movc r0.x, ${ttlFaceFade}.x, l(0), r0.x${eol}
${discard}${body}${weight_op}movc ${weight}, ${ttlFaceFade}.x, l(0.200000), ${weight}${eol}

