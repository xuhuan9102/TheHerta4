# ⚠️ 本工作流【不采用】：TheHerta4 的发布包一律**手动打包**（流程见 docs/release-packaging.md）。
# 保留它只为给 tools/package_release.py 提供排除规则（脚本解析下面的 --exclude= 名单，
# 规则只此一处，改这里即同时改打包脚本）。
# 不采用的原因（2026-09-15 查证）：tag 触发的运行 #91(v4.4.45)/#92(v4.4.46)/#93(v4.4.47)
# 全部 conclusion=failure，Annotations 原文：
#   "The job was not started because your account is locked due to a billing issue."
# （GitHub 账号计费锁定）⇒ tag 推送不会产出 Release，历史 Release 均为手工上传 zip。
name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create Release Package
        id: package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          VERSION=${VERSION//./-}
          ZIP_NAME="TheHerta4-${VERSION}.zip"

          STAGING_DIR="$(mktemp -d)"
          PACKAGE_ROOT="$STAGING_DIR/TheHerta4"
          mkdir -p "$PACKAGE_ROOT"

          # Keep an outer TheHerta4 folder so Blender can install the zip directly.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.agents' \
            --exclude='.trae' \
            --exclude='.venv' \
            --exclude='.codex_benchmarks' \
            --exclude='.codegraph' \
            --exclude='.dbg' \
            --exclude='.kunsdd' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.bak-*' \
            --exclude='*.GOOD-*' \
            --exclude='*.log' \
            --exclude='*.md' \
            --exclude='docs' \
            --exclude='dist' \
            --exclude='DIST' \
            --exclude='Logs' \
            --exclude='references' \
            --exclude='reports' \
            --exclude='test' \
            --exclude='test_result.txt' \
            --exclude='tests' \
            --exclude='tools' \
            --exclude='theherta4_updater' \
            --exclude='.gitignore' \
            --exclude='skills-lock.json' \
            --exclude='README.md' \
            --exclude='README_DEV.md' \
            --exclude='requirements.txt' \
            ./ "$PACKAGE_ROOT/"

          (
            cd "$STAGING_DIR"
            zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" "TheHerta4"
          )

          SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

          ls -la "$ZIP_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_name }}
          body: |
            ## Automated Release Package

            **SHA256**: `${{ steps.package.outputs.sha256 }}`

            Install:
            1. Download the zip package.
            2. In Blender, open `Edit > Preferences > Add-ons > Install`.
            3. Select the downloaded zip file.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
